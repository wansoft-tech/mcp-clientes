[project]
name = "puerta-wansoft"
version = "0.1.0"
description = "La puerta del conector «Wansoft»: inicio de sesión con el portal de Wansoft y reenvío al servidor de cada persona"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
puerta-wansoft = "puerta_wansoft.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["puerta_wansoft"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
