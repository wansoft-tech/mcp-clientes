[project]
name = "wansoft-mcp-cliente"
version = "0.3.1"
description = "Servidor MCP de soporte para clientes de Wansoft: su base de Odoo en solo lectura y las herramientas de Wansoft"
requires-python = ">=3.12"
dependencies = [
    # Licencia MPL 2.0. Se usa como dependencia, sin modificar sus archivos.
    "mcp-server-odoo==0.9.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
wansoft-mcp-cliente = "wansoft_mcp_cliente.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wansoft_mcp_cliente"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
