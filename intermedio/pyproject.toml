[project]
name = "wansoft-mcp-provisioner"
version = "0.2.0"
description = "Intermedio de Conectá con Claude: levanta y elimina en Easypanel los servidores MCP de cada persona"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wansoft-mcp-provisioner = "provisioner.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["provisioner"]
