# Construye y publica la imagen del servidor del cliente al crear una etiqueta
# servidor-v<versión>. Los tests corren antes: si fallan, no se publica.
name: Imagen del servidor MCP del cliente

on:
  push:
    tags: ['servidor-v*']
  pull_request:
    paths: ['servidor/**']

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q

  imagen:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/servidor-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "valor=${GITHUB_REF_NAME#servidor-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: servidor
          push: true
          tags: ghcr.io/wansoft-tech/mcp-cliente:${{ steps.version.outputs.valor }}
