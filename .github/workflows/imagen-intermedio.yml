# Construye y publica la imagen del intermedio al crear una etiqueta
# intermedio-v<versión>, o a mano desde Actions («Run workflow»), con la versión
# de intermedio/pyproject.toml. Los tests corren antes: si fallan, no se publica.
name: Imagen del intermedio

on:
  push:
    tags: ['intermedio-v*']
  pull_request:
    paths: ['intermedio/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intermedio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q

  imagen:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/intermedio-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            valor=$(sed -n 's/^version = "\(.*\)"/\1/p' intermedio/pyproject.toml)
          else
            valor=${GITHUB_REF_NAME#intermedio-v}
          fi
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: intermedio
          push: true
          tags: ghcr.io/wansoft-tech/mcp-provisioner:${{ steps.version.outputs.valor }}
